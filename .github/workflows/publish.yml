name: Publish image

# Version tags, from release-please or pushed by hand.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Image to GHCR plus SLSA provenance. Verify with:
  #   gh attestation verify oci://ghcr.io/drumandbytes/paddock-api:latest --owner drumandbytes
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo
      artifact-metadata: write # storage record for the pushed image
    uses: drumandbytes/reusable-actions/.github/workflows/docker-publish.yml@v1
    with:
      # The cluster runs amd64 only.
      platforms: linux/amd64
      tags: |
        type=semver,pattern={{version}}
        type=raw,value=latest
